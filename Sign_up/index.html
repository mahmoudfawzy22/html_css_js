<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="master.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="img-section">
        <img
          src="images/halie-west-25xggax4bSA-unsplash.jpg"
          alt="Background image"
        />
        <div class="logo">
          <img src="images/odin-lined.png" alt="Odin logo" />
          <h1>ODIN</h1>
        </div>
        <p>
          Photo by <a href="#">Halie West</a> on
          <a href="https://unsplash.com">Unsplash</a>
        </p>
      </div>

      <div class="page-section">
        <div class="heading-p">
          <p>
            This is not a real online service! You need something like this in
            your life to help you realize your deepest dreams. Sign up now to
            get started.
          </p>
          <p>You know you want to.</p>
        </div>

        <div class="sign-content">
            <h4>Let's do this!</h4>
          <form action="">
            <div class="sign-element">
              
              <div class="row">
                <div class="input">
                  <label for="first-name">First name</label>
                  <input type="text" id="first-name" name="first-name" />
                </div>
                <div class="input">
                  <label for="last-name">Last name</label>
                  <input type="text" id="last-name" name="last-name" />
                </div>
              </div>

              <div class="row">
                <div class="input">
                  <label for="email">Email</label>
                  <input type="email" id="email" name="email" />
                </div>
                <div class="input">
                  <label for="phone-number">Phone number</label>
                  <input type="tel" id="phone-number" name="phone-number" />
                </div>
              </div>

              <div class="row">
                <div class="input">
                  <label for="pass">Password</label>
                  <input type="password" id="pass" name="password" />
                </div>
                <div class="input">
                  <label for="con-pass">Confirm password</label>
                  <input
                    type="password"
                    id="con-pass"
                    name="confirm-password"
                  />
                </div>
              </div>
            </div>
            <div class="submint">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">log in</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
